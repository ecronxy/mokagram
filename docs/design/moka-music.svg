<svg xmlns="http://www.w3.org/2000/svg" width="850" height="740" viewBox="0 0 850 740">
<title>mokaGram — музыка: элементы экрана</title><desc>Схема экрана музыки по приложенному снимку и исходному коду. Цвета иллюстративны и зависят от активной темы.</desc>
<rect width="850" height="740" fill="#eeeeef"/><g font-family="sans-serif" fill="#19191b"><text x="32" y="45" font-size="25" font-weight="700">Музыка / элементы интерфейса</text><text x="32" y="72" font-size="14" fill="#666">Схема по экрану и коду · цвета зависят от темы</text>
<rect x="32" y="100" width="365" height="600" rx="28" fill="#19191b"/><circle cx="59" cy="129" r="18" fill="#29292b"/><path d="M54 124l10 10m0-10l-10 10" stroke="#eee" stroke-width="2" stroke-linecap="round"/><text x="214" y="135" text-anchor="middle" font-size="16" font-weight="600" fill="#eee">Music</text><text x="348" y="135" text-anchor="middle" font-size="13" fill="#408fff">Queue</text>
<rect x="48" y="164" width="333" height="44" rx="22" fill="#29292b"/><text x="66" y="191" font-size="13" fill="#92949e">Search music in chats and groups</text>
<rect x="48" y="218" width="333" height="40" rx="20" fill="#363638"/><rect x="214" y="222" width="163" height="32" rx="16" fill="#4085ed"/><text x="131" y="243" text-anchor="middle" font-size="13" fill="#92949e">SoundCloud</text><text x="295" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">From chats</text>
<rect x="48" y="266" width="333" height="36" rx="18" fill="#202022"/><text x="214" y="289" text-anchor="middle" font-size="13" fill="#408fff">Choose a chat</text>
<g font-size="13"><rect x="52" y="322" width="56" height="56" rx="8" fill="#363638"/><text x="124" y="345" fill="#fff" font-weight="600">Название трека</text><text x="124" y="368" fill="#92949e">Исполнитель · чат</text><text x="370" y="355" text-anchor="end" fill="#92949e">0:56</text>
<rect x="40" y="394" width="349" height="68" rx="12" fill="#363638"/><rect x="52" y="400" width="56" height="56" rx="8" fill="#525258"/><text x="124" y="423" fill="#fff" font-weight="600">Выбранный трек</text><text x="124" y="446" fill="#92949e">Исполнитель · чат</text><text x="370" y="433" text-anchor="end" fill="#92949e">3:14</text>
<rect x="52" y="478" width="56" height="56" rx="8" fill="#363638"/><text x="124" y="501" fill="#fff" font-weight="600">Следующий трек</text><text x="124" y="524" fill="#92949e">Исполнитель · чат</text><text x="370" y="511" text-anchor="end" fill="#92949e">4:15</text></g>
<g font-size="15"><text x="440" y="145" font-size="19" font-weight="700">Что здесь относится к айдентике</text><text x="440" y="190">Окно и заголовок</text><text x="440" y="215" fill="#666">Круглая кнопка закрытия, радиус окна</text><text x="440" y="265">Поиск и выбор чата</text><text x="440" y="290" fill="#666">Поля и действия в форме пилюли</text><text x="440" y="340">Выбор источника</text><text x="440" y="365" fill="#666">Контейнер 40 px, активная часть 32 px</text><text x="440" y="415">Строка трека</text><text x="440" y="440" fill="#666">Обложка, название, подпись, длительность</text><text x="440" y="490">Состояние строки</text><text x="440" y="515" fill="#666">Подсветка с радиусом 12 px при наведении</text><text x="440" y="540" fill="#666">или воспроизведении; обложка — 8 px</text><text x="440" y="603" fill="#666">Это схема, а не снимок работающего приложения.</text></g></g></svg>
