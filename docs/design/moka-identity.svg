<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<title>mokaGram — визуальные элементы</title><desc>Схематический лист общих UI-элементов Моки с цветами палитры по умолчанию. Размеры переключателей и радиусы соответствуют исходному коду.</desc>
<rect width="1200" height="850" fill="#f1f1f1"/>
<g font-family="sans-serif" fill="#171717"><text x="52" y="68" font-size="32" font-weight="700">mokaGram / визуальные элементы</text><text x="52" y="99" font-size="16" fill="#666">Схема для проверки · светлая палитра по умолчанию · фактическая тема может отличаться</text>
<text x="52" y="160" font-size="22" font-weight="700">Цветовые роли</text>
<g font-size="14"><rect x="52" y="180" width="175" height="70" rx="12" fill="#fff"/><text x="52" y="276">windowBg · #ffffff</text><rect x="247" y="180" width="175" height="70" rx="12" fill="#40a7e3"/><text x="247" y="276">windowBgActive · #40a7e3</text><rect x="442" y="180" width="175" height="70" rx="12" fill="#999"/><text x="442" y="276">windowSubTextFg · #999999</text><rect x="637" y="180" width="175" height="70" rx="12" fill="#000"/><text x="637" y="276">windowFg · #000000</text><rect x="832" y="180" width="175" height="70" rx="12" fill="#fcdfde"/><text x="832" y="276">attention · #fcdfde</text></g>
<text x="52" y="340" font-size="22" font-weight="700">Форма и иерархия</text><rect x="52" y="365" width="330" height="195" rx="28" fill="#fff"/><text x="76" y="402" font-size="17" font-weight="700">Окно · радиус 28</text><rect x="76" y="420" width="282" height="76" rx="22" fill="#f1f1f1"/><text x="92" y="463" font-size="15">Карточка · радиус до 22</text><rect x="76" y="512" width="118" height="40" rx="20" fill="#40a7e3"/><text x="135" y="537" text-anchor="middle" fill="white" font-size="14">Действие</text><rect x="204" y="512" width="118" height="40" rx="20" fill="#f1f1f1"/><text x="263" y="537" text-anchor="middle" font-size="14">Отмена</text>
<text x="430" y="402" font-size="17" font-weight="700">Круглые кнопки · 36 × 36</text><g transform="translate(430 425)"><circle cx="18" cy="18" r="18" fill="#fff"/><path d="M13 13l10 10m0-10L13 23" fill="none" stroke="#000" stroke-width="1.65" stroke-linecap="round"/><circle cx="70" cy="18" r="18" fill="#fff"/><path d="M72 12l-6 6 6 6" fill="none" stroke="#000" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><circle cx="122" cy="18" r="18" fill="#fff"/><g fill="#000"><circle cx="122" cy="13" r="1.65"/><circle cx="122" cy="18" r="1.65"/><circle cx="122" cy="23" r="1.65"/></g></g>
<text x="52" y="635" font-size="22" font-weight="700">Переключатель · 40 × 24</text><text x="52" y="666" font-size="14" fill="#666">Масштаб ×3 для проверки; переход 200 мс</text><g transform="translate(52 690) scale(3)"><rect x="1" y="1" width="38" height="22" rx="11" fill="none" stroke="#999" stroke-width="1.6"/><circle cx="12" cy="12" r="5" fill="#999"/></g><g transform="translate(240 690) scale(3)"><rect x="1" y="1" width="38" height="22" rx="11" fill="#40a7e3" stroke="#40a7e3" stroke-width="1.6"/><circle cx="28" cy="12" r="9" fill="#fff"/></g><text x="52" y="792" font-size="14">Выключен</text><text x="240" y="792" font-size="14">Включён</text><text x="430" y="714" font-size="15">Недоступная система плагинов</text><text x="430" y="739" font-size="15">показывает выключенное состояние,</text><text x="430" y="764" font-size="15">сохраняя выбор пользователя.</text></g></svg>
